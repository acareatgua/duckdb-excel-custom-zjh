name: Build Excel Windows Only

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  build-windows:

    name: Build Windows x64 Excel Extension

    runs-on: windows-2022


    defaults:
      run:
        shell: bash


    env:

      GEN: ninja

      DUCKDB_PLATFORM: windows_amd64

      EXTENSION_NAME: excel

      # 强制使用 GitHub runner 自带 vcpkg
      VCPKG_ROOT: C:/vcpkg

      # 强制 CMake 使用 vcpkg toolchain
      CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake


    steps:


      # -----------------------------
      # checkout
      # -----------------------------
      - name: Checkout duckdb-excel

        uses: actions/checkout@v4

        with:

          submodules: recursive

          fetch-depth: 1



      # -----------------------------
      # DuckDB version
      # -----------------------------
      - name: Checkout exact DuckDB v1.5.4 source

        run: |

          git -C duckdb fetch --force --tags origin

          git -C duckdb checkout --force v1.5.4


          echo "DuckDB commit:"

          git -C duckdb log -1 --oneline



      # -----------------------------
      # MSVC
      # -----------------------------
      - name: Setup MSVC

        uses: ilammy/msvc-dev-cmd@v1

        with:

          arch: x64



      # -----------------------------
      # Ninja
      # -----------------------------
      - name: Install Ninja

        shell: pwsh

        run: |

          choco install ninja --yes --no-progress



      # -----------------------------
      # vcpkg
      # -----------------------------
      - name: Install vcpkg dependencies

        shell: pwsh

        run: |


          Write-Host "Using vcpkg:"

          vcpkg version


          Write-Host "Installing manifest dependencies"


          cd $env:GITHUB_WORKSPACE


          vcpkg install `
            --triplet x64-windows


          Write-Host "vcpkg finished"



      # -----------------------------
      # Build
      # -----------------------------
      - name: Build release extension


        run: |


          echo "VCPKG_ROOT=$VCPKG_ROOT"

          echo "CMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"


          make release



      # -----------------------------
      # Collect files
      # -----------------------------
      - name: Locate extension


        shell: pwsh


        run: |


          $ext = Get-ChildItem `

            -Path build/release `

            -Recurse `

            -Filter excel.duckdb_extension |


            Select-Object -First 1



          if (-not $ext) {

            Write-Error "excel.duckdb_extension not found"

            exit 1

          }



          Write-Host "Extension found:"

          Write-Host $ext.FullName



          New-Item `

            -ItemType Directory `

            -Force `

            artifact | Out-Null



          Copy-Item `

            $ext.FullName `

            artifact/excel.duckdb_extension




          $duckdb = Get-ChildItem `

            -Path build/release `

            -Filter duckdb.exe `

            -Recurse |


            Select-Object -First 1



          if ($duckdb) {

            Copy-Item `

              $duckdb.FullName `

              artifact/duckdb.exe

          }



      # -----------------------------
      # Upload
      # -----------------------------
      - name: Upload Windows Excel Extension


        uses: actions/upload-artifact@v4


        with:


          name: excel-windows-amd64-duckdb-v1.5.4


          path: artifact/


          if-no-files-found: error
