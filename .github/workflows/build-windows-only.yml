name: Build Windows x64 Excel Extension


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: windows-2022


    steps:


    - name: Checkout duckdb-excel

      uses: actions/checkout@v4



    - name: Prepare DuckDB source

      shell: pwsh

      run: |

        git clone https://github.com/duckdb/duckdb.git duckdb


        cd duckdb


        git checkout v1.5.4


        cd ..



        # copy build tools

        Copy-Item `
          -Recurse `
          -Force `
          duckdb/extension-ci-tools `
          ./extension-ci-tools




    - name: Setup MSVC

      uses: ilammy/msvc-dev-cmd@v1

      with:

        arch: x64



    - name: Install Ninja

      shell: pwsh

      run: |

        choco install ninja -y

        ninja --version



    - name: Build extension

      shell: bash

      run: |


        export GEN=ninja

        export DUCKDB_PLATFORM=windows_amd64

        export EXTENSION_NAME=excel


        echo "start build"


        make release



    - name: Collect artifacts

      shell: pwsh

      run: |

        Get-ChildItem `
          -Recurse `
          -Include "*.duckdb_extension","*.zip"
