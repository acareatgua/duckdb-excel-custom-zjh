name: Build Excel Windows Only

on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  build-windows:

    name: Build Windows x64 Excel Extension

    runs-on: windows-2022


    defaults:
      run:
        shell: bash


    env:
      GEN: ninja
      DUCKDB_PLATFORM: windows_amd64
      EXTENSION_NAME: excel


    steps:


    - name: Checkout duckdb-excel
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1


    - name: Checkout exact DuckDB v1.5.4 source
      run: |
        git -C duckdb fetch --force --tags origin
        git -C duckdb checkout --force v1.5.4

        echo "DuckDB source commit:"
        git -C duckdb log -1 --oneline

        echo "DuckDB exact tag:"
        git -C duckdb describe --tags --exact-match


    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64


    - name: Install Ninja
      shell: pwsh
      run: |
        choco install ninja --yes --no-progress


    - name: Build release extension
      run: |
        make release


    - name: Locate extension
      shell: pwsh
      run: |

        $file = Get-ChildItem `
          -Path build/release `
          -Recurse `
          -Filter excel.duckdb_extension |
          Select-Object -First 1


        if (-not $file) {
          Write-Error "excel.duckdb_extension not found"
          exit 1
        }


        New-Item -ItemType Directory -Force artifact | Out-Null

        Copy-Item `
          $file.FullName `
          artifact/excel.duckdb_extension



        $duckdbExe = Get-ChildItem `
          -Path build/release `
          -Filter duckdb.exe |
          Select-Object -First 1


        Copy-Item `
          $duckdbExe.FullName `
          artifact/duckdb.exe



    - name: Upload
      uses: actions/upload-artifact@v4
      with:

        name: excel-windows-amd64-duckdb-v1.5.4

        path: artifact/
