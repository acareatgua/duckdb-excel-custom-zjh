name: Build Excel Windows Only


on:
  workflow_dispatch:


permissions:
  contents: read



jobs:

  build-windows:


    name: Build Windows x64 Excel Extension


    runs-on: windows-2022



    defaults:

      run:

        shell: bash



    env:

      GEN: ninja

      DUCKDB_PLATFORM: windows_amd64

      EXTENSION_NAME: excel



    steps:



      # --------------------------------
      # Checkout source
      # --------------------------------

      - name: Checkout duckdb-excel

        uses: actions/checkout@v4

        with:

          submodules: recursive

          fetch-depth: 1





      # --------------------------------
      # Fix DuckDB version
      # --------------------------------

      - name: Checkout exact DuckDB v1.5.4 source

        run: |

          git -C duckdb fetch --force --tags origin

          git -C duckdb checkout --force v1.5.4


          echo "DuckDB commit:"

          git -C duckdb log -1 --oneline


          echo "DuckDB version:"

          git -C duckdb describe --tags --exact-match





      # --------------------------------
      # MSVC
      # --------------------------------

      - name: Setup MSVC

        uses: ilammy/msvc-dev-cmd@v1

        with:

          arch: x64





      # --------------------------------
      # Ninja
      # --------------------------------

      - name: Install Ninja

        shell: pwsh

        run: |

          choco install ninja --yes --no-progress





      # --------------------------------
      # vcpkg
      # --------------------------------

      - name: Install vcpkg dependencies

        shell: pwsh

        run: |

          Write-Host "Install vcpkg manifest dependencies"


          vcpkg install --triplet x64-windows


          Write-Host "vcpkg completed"





      # --------------------------------
      # Build
      # --------------------------------

      - name: Build release extension

        run: |

          make release VCPKG=1





      # --------------------------------
      # Collect extension
      # --------------------------------

      - name: Locate extension

        shell: pwsh

        run: |


          Write-Host "Searching excel extension"



          $extension = Get-ChildItem `

            -Path build/release `

            -Recurse `

            -Filter excel.duckdb_extension |

            Select-Object -First 1



          if (-not $extension) {

            Write-Error "excel.duckdb_extension not found"

            exit 1

          }



          Write-Host "Found extension:"

          Write-Host $extension.FullName



          New-Item `

            -ItemType Directory `

            -Force `

            artifact | Out-Null



          Copy-Item `

            $extension.FullName `

            artifact/excel.duckdb_extension





          $duckdb = Get-ChildItem `

            -Path build/release `

            -Filter duckdb.exe |

            Select-Object -First 1



          if (-not $duckdb) {

            Write-Error "duckdb.exe not found"

            exit 1

          }



          Copy-Item `

            $duckdb.FullName `

            artifact/duckdb.exe





      # --------------------------------
      # Upload
      # --------------------------------

      - name: Upload Windows artifact


        uses: actions/upload-artifact@v4


        with:


          name: excel-windows-amd64-duckdb-v1.5.4


          path: artifact/


          if-no-files-found: error
