name: Build Windows x64 Excel Extension


on:
  workflow_dispatch:


jobs:

  build:

    name: Build Excel Extension Windows x64

    runs-on: windows-2022


    steps:


    - name: Checkout duckdb-excel

      uses: actions/checkout@v4
      with:
        submodules: recursive



    - name: Prepare DuckDB source

      shell: pwsh

      run: |

        git clone https://github.com/duckdb/duckdb.git duckdb

        cd duckdb

        git checkout v1.5.4

        git submodule update --init --recursive

        cd ..



    - name: Setup MSVC

      uses: ilammy/msvc-dev-cmd@v1

      with:

        arch: x64



    - name: Install Ninja

      shell: pwsh

      run: |

        choco install ninja -y

        ninja --version



    - name: Build Excel extension

      shell: bash

      run: |

        export GEN=ninja

        export DUCKDB_PLATFORM=windows_amd64

        export EXTENSION_NAME=excel


        echo "Building DuckDB Excel extension"

        make release



    - name: Check generated files

      shell: pwsh

      run: |

        Write-Host "Searching extension files..."

        Get-ChildItem `
          -Recurse `
          -Include "*.duckdb_extension","*.zip"



    - name: Upload Excel extension artifact

      uses: actions/upload-artifact@v4

      with:

        name: excel-v1.5.4-windows-amd64

        path: |

          **/*.duckdb_extension

          **/*.zip
